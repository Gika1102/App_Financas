<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Meu Espaço</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf5ff;color:#574f6b;font:16px "Segoe UI",sans-serif}.card{width:min(390px,calc(100% - 32px));background:#fff;padding:28px;border-radius:22px;box-shadow:0 8px 28px #b79cf233}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:10px;border-radius:12px;border:1px solid #e6d9ff;font:inherit}button{border:0;background:#ff8fb8;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e6d9ff;color:#574f6b}#message{min-height:22px;color:#a14b6c}</style></head><body><main class="card"><h1>Meu Espaço 🌸</h1><p>Entre para acessar seus dados com segurança.</p><form id="authForm"><input id="email" type="email" placeholder="seu e-mail" required><input id="password" type="password" minlength="6" placeholder="senha (mínimo 6 caracteres)" required><button id="submit" type="submit">Entrar</button></form><button class="secondary" id="mode" type="button">Criar uma conta</button><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>let signup=false;const q=id=>document.getElementById(id);if(!window.supabaseClient){q('message').textContent='Configure a URL e a chave pública do Supabase em js/supabase.js.'}q('mode').onclick=()=>{signup=!signup;q('submit').textContent=signup?'Criar conta':'Entrar';q('mode').textContent=signup?'Já tenho uma conta':'Criar uma conta'};q('authForm').onsubmit=async e=>{e.preventDefault();const email=q('email').value,password=q('password').value;q('message').textContent='Aguarde...';const r=signup?await supabaseClient.auth.signUp({email,password}):await supabaseClient.auth.signInWithPassword({email,password});if(r.error){console.error(r.error);q('message').textContent=r.error.message;return}if(signup&&!r.data.session){q('message').textContent='Conta criada. Confira seu e-mail para confirmar o cadastro.';return}location.replace('index.html')};</script></body></html>
