<!DOCTYPE html>
<!--
  ============================================================
  PÁGINA INICIAL — Hub pessoal
  Conecta o app de Finanças (financas.html) e o Life Dashboard
  (life-dashboard.html). Um único arquivo, sem dependências.
  ============================================================
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início — Meu Espaço</title>
<style>
  :root{
    --lavender: 184 169 232;
    --pink: 246 201 217;
    --bg-1: #FBF6EF;
    --bg-2: #F3EAFB;
    --bg-3: #FDECF3;
    --text-primary: #362F49;
    --text-secondary: #857C9C;
    --card-bg: rgba(255,255,255,0.62);
    --card-border: rgba(255,255,255,0.7);
    --shadow-soft: 0 8px 30px rgba(140,120,180,0.14);
    --shadow-hover: 0 18px 44px rgba(140,120,180,0.22);
    --transition: 300ms cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"]{
    --bg-1:#1B1826; --bg-2:#211B30; --bg-3:#251C2C;
    --text-primary:#EDE9F7; --text-secondary:#ABA1C7;
    --card-bg: rgba(38,33,56,0.62); --card-border: rgba(255,255,255,0.08);
    --shadow-soft: 0 8px 30px rgba(0,0,0,0.35);
    --shadow-hover: 0 18px 44px rgba(0,0,0,0.5);
    --lavender: 168 150 224; --pink: 224 150 183;
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    min-height:100vh;
    background: radial-gradient(circle at 15% 10%, var(--bg-3), transparent 55%),
                radial-gradient(circle at 85% 0%, var(--bg-2), transparent 50%),
                var(--bg-1);
    display:flex; flex-direction:column; align-items:center;
    padding: 40px 20px;
    transition: background var(--transition), color var(--transition);
  }
  .top-bar{ width:100%; max-width:900px; display:flex; justify-content:flex-end; margin-bottom:20px; }
  .theme-btn{
    width:42px; height:42px; border-radius:14px; border:1px solid var(--card-border);
    background: var(--card-bg); backdrop-filter: blur(12px); font-size:18px;
    cursor:pointer; transition: all var(--transition);
  }
  .theme-btn:hover{ transform: translateY(-2px) scale(1.05); box-shadow: var(--shadow-soft); }

  .hero{ text-align:center; margin-bottom:44px; }
  .hero .logo{ font-size:44px; margin-bottom:6px; }
  .hero h1{ font-size:30px; font-weight:800; letter-spacing:-0.03em; margin-bottom:8px; }
  .hero p{ font-size:14px; color: var(--text-secondary); }

  .cards{
    display:grid; grid-template-columns: repeat(2, 1fr); gap:24px;
    width:100%; max-width:820px;
  }
  .app-card{
    display:flex; flex-direction:column; gap:14px;
    background: var(--card-bg); border:1px solid var(--card-border);
    border-radius:26px; padding:32px 26px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow-soft);
    text-decoration:none; color:inherit;
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .app-card:hover{ transform: translateY(-6px); box-shadow: var(--shadow-hover); }
  .app-card .icon{
    width:56px; height:56px; border-radius:18px;
    display:flex; align-items:center; justify-content:center; font-size:27px;
    background: linear-gradient(135deg, rgba(var(--lavender),0.35), rgba(var(--pink),0.35));
  }
  .app-card h2{ font-size:19px; font-weight:800; letter-spacing:-0.02em; }
  .app-card p{ font-size:13px; color: var(--text-secondary); line-height:1.5; }
  .app-card .go{ font-size:12.5px; font-weight:700; color: var(--text-primary); display:flex; align-items:center; gap:6px; margin-top:auto; }
  .app-card .go .arrow{ transition: transform var(--transition); }
  .app-card:hover .go .arrow{ transform: translateX(5px); }

  footer{ margin-top:48px; font-size:11.5px; color: var(--text-secondary); text-align:center; }

  @media (max-width: 640px){
    .cards{ grid-template-columns: 1fr; }
    .hero h1{ font-size:24px; }
  }
</style>
</head>
<body data-theme="light">

<div class="top-bar">
  <button class="theme-btn" id="themeBtn" title="Alternar tema">🌙</button>
</div>

<div class="hero">
  <div class="logo">🌷</div>
  <h1>Bem-vindo(a) de volta</h1>
  <p>Escolha para onde quer ir</p>
</div>

<div class="cards">
  <a class="app-card" href="financas.html">
    <div class="icon">💰</div>
    <h2>Finanças</h2>
    <p>Controle seus gastos, receitas e metas financeiras.</p>
    <div class="go"><span>Abrir Finanças</span><span class="arrow">→</span></div>
  </a>

  <a class="app-card" href="life-dashboard.html">
    <div class="icon">🌸</div>
    <h2>Life Dashboard</h2>
    <p>Seu planner pessoal: rotina, hábitos, semana e mês.</p>
    <div class="go"><span>Abrir Life Dashboard</span><span class="arrow">→</span></div>
  </a>
</div>

<footer>Feito com 💜 · seu espaço pessoal</footer>

<script>
(function(){
  "use strict";
  const KEY = 'homeThemePref';
  const btn = document.getElementById('themeBtn');
  function apply(theme){
    document.body.setAttribute('data-theme', theme);
    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem(KEY, theme);
  }
  apply(localStorage.getItem(KEY) || 'light');
  btn.addEventListener('click', ()=>{
    apply(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
